name: Auto-sync education data

# Weekly watcher for AICTE / UGC / NTA / CET Cell / MoE notices and roadmap.sh.
# It never edits roadmaps_india.json directly. It stages patches and opens a pull
# request so a human reviews changes before they reach production.
on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-sync-education
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Validate current datasets
        run: python -m backend.scripts.validate_data

      - name: Run education watcher
        env:
          LLM_PROVIDER: auto
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m backend.scripts.update_education_data | tee watcher_report.json

      - name: Validate datasets after sync
        run: python -m backend.scripts.validate_data

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Open pull request with staged updates
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/education-sync
          delete-branch: true
          commit-message: "chore(data): weekly education notice sync"
          title: "Weekly education data sync"
          body: |
            Automated run of `backend/scripts/update_education_data.py`.

            - Review staged patches in `backend/data/staged_patches/` against the official source.
            - Set `"status": "approved"` on patches you accept, then run
              `python -m backend.scripts.update_education_data --apply <file>`.
            - New official PDFs were added to `backend/data/rag_policies/` and the AI Mentor index rebuilds automatically.
          add-paths: |
            backend/data/staged_patches/**
            backend/data/rag_policies/**
            backend/data/watcher_state.json
