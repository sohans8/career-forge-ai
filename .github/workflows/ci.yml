name: CI

# Runs on every push and pull request. Render and Netlify deploy from the
# default branch, so a red run here means the next deploy would ship a bug.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Validate datasets
        run: python -m backend.scripts.validate_data
      - name: Run tests
        run: python -m pytest backend/tests -q
      - name: Smoke-test the server
        run: |
          python -m uvicorn backend.app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
          curl -fs "http://127.0.0.1:8000/api/roadmaps?stage=after_10th" > /dev/null
          curl -fs http://127.0.0.1:8000/api/status

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
